name: 3. Promote UAT → PROD

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number that was merged into UAT"
        required: true
        type: number
      source_branch:
        description: "Source branch: uat"
        required: true
        type: choice
        options:
          - uat

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Setup environment
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate UAT PR
        id: validate
        run: |
          PR="${{ github.event.inputs.pr_number }}"
          if [ -z "$PR" ]; then
            echo "Error: PR number cannot be empty." >&2
            exit 1
          fi

          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}")

          ERR=$(echo "$PR_JSON" | jq -r '.message // empty')
          if [ -n "$ERR" ]; then
            echo "Error: PR #$PR not found. API message: $ERR" >&2
            exit 1
          fi

          BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.base.ref')
          MERGED=$(echo "$PR_JSON" | jq -r '.merged')
          MERGE_COMMIT=$(echo "$PR_JSON" | jq -r '.merge_commit_sha')

          if [ "$MERGED" != "true" ]; then
            echo "Error: PR #$PR is not merged." >&2
            exit 1
          fi

          if [ "$BASE_BRANCH" != "uat" ]; then
            echo "Error: PR #$PR must have been merged into uat (found: $BASE_BRANCH)." >&2
            exit 1
          fi

          echo "merge_commit=$MERGE_COMMIT" >> $GITHUB_OUTPUT
          echo "pr_number=$PR" >> $GITHUB_OUTPUT

      - name: Validate commit exists in UAT
        run: |
          git fetch origin uat
          COMMIT="${{ steps.validate.outputs.merge_commit }}"

          if ! git merge-base --is-ancestor "$COMMIT" origin/uat; then
            echo "Error: The merge commit does not exist in uat branch."
            exit 1
          fi

      - name: Extract UAT merge commit changes
        id: extract
        run: |
          MERGE="${{ steps.validate.outputs.merge_commit }}"
          PARENT_UAT=$(git log --pretty=%P -n 1 "$MERGE" | awk '{print $1}')

          echo "uat_merge_commit=$MERGE" >> $GITHUB_OUTPUT
          echo "parent_uat=$PARENT_UAT" >> $GITHUB_OUTPUT

          CHANGED_FILES=$(git diff --name-only "$PARENT_UAT" "$MERGE")
          FILE_COUNT=$(echo "$CHANGED_FILES" | wc -l | tr -d ' ')
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT

          echo "changed_files<<EOF" >> $GITHUB_ENV
          echo "$CHANGED_FILES"
          echo "EOF" >> $GITHUB_ENV

          echo "commit_messages<<EOF" >> $GITHUB_ENV
          git log --oneline "$PARENT_UAT".."$MERGE"
          echo "EOF" >> $GITHUB_ENV

      - name: Extract Jira ID
        run: |
          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.validate.outputs.pr_number }}")

          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          BODY=$(echo "$PR_JSON" | jq -r '.body')

          JIRA=$(echo "$TITLE" | grep -oE "\[?JIRA-[0-9]+\]?" | head -1 | tr -d '[]' || echo "")
          if [ -z "$JIRA" ]; then
            JIRA=$(echo "$BODY" | grep -oE "JIRA-[0-9]+" | head -1 || echo "")
          fi
          if [ -z "$JIRA" ]; then
            JIRA="PR-${{ steps.validate.outputs.pr_number }}"
          fi

          echo "jira_id=$JIRA" >> $GITHUB_ENV

      - name: Check if commit already exists in PROD
        run: |
          git fetch origin prod
          if git merge-base --is-ancestor "${{ steps.validate.outputs.merge_commit }}" origin/prod; then
            echo "Changes already exist in prod. Exiting workflow."
            exit 0
          fi

      - name: Create promotion branch
        id: create_branch
        run: |
          TS=$(date +%s)
          BR="promote/${{ env.jira_id }}-uat-pr${{ steps.validate.outputs.pr_number }}-${TS}"
          git checkout -b "$BR" origin/prod
          echo "branch=$BR" >> $GITHUB_OUTPUT

      - name: Apply UAT merge commit to PROD with conflict handling
        id: apply
        run: |
          UAT_MERGE="${{ steps.extract.outputs.uat_merge_commit }}"

          if git cherry-pick -x "$UAT_MERGE"; then
            echo "changes_applied=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Conflicts detected. Attempting automatic resolution for UU/AA conflicts."

          CONFLICTS=$(git status --porcelain | grep -E '^(UU|AA)')
          OTHER=$(git status --porcelain | grep -vE '^(UU|AA)')

          if [ -n "$OTHER" ]; then
            echo "Conflicts could not be resolved automatically. Manual intervention required."
            git cherry-pick --abort
            exit 1
          fi

          RESOLVED=true
          echo "$CONFLICTS" | while read line; do
            FILE=$(echo "$line" | cut -c4-)
            git checkout "$UAT_MERGE" -- "$FILE" || RESOLVED=false
            git add "$FILE"
          done

          if [ "$RESOLVED" != "true" ]; then
            echo "Conflicts could not be resolved automatically. Manual intervention required."
            git cherry-pick --abort
            exit 1
          fi

          git cherry-pick --continue
          echo "changes_applied=true" >> $GITHUB_OUTPUT

      - name: Prepare PR body
        id: prepare_body
        if: steps.apply.outputs.changes_applied == 'true'
        run: |
          {
            echo "Jira ID: ${{ env.jira_id }}"
            echo "Source PR: #${{ steps.validate.outputs.pr_number }} (merged into uat)"
            echo "Target branch: prod"
            echo ""
            echo "Changes identified: ${{ steps.extract.outputs.file_count }} files"
            echo ""
            echo "Changed files:"
            echo "${{ env.changed_files }}"
            echo ""
            echo "Commit messages:"
            echo "${{ env.commit_messages }}"
            echo ""
            echo "PR ID reference below can be used to identify the exact changes deployed into production."
          } > body.txt

      - name: Push promotion branch
        if: steps.apply.outputs.changes_applied == 'true'
        run: |
          git push origin "${{ steps.create_branch.outputs.branch }}"

      - name: Create PR into PROD
        id: create_pr
        if: steps.apply.outputs.changes_applied == 'true'
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          TITLE="[${{ env.jira_id }}] Promote changes from uat to prod"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg head "$BR" \
            --arg base "prod" \
            --arg body "$(cat body.txt)" \
            '{title:$title, head:$head, base:$base, body:$body}')

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/${{ github.repository }}/pulls")

          echo "$RESPONSE" > created.json
          PR_NUM=$(jq -r '.number' created.json)

          if [ "$PR_NUM" = "null" ]; then
            echo "Error creating PR: $(jq -r '.message' created.json)" >&2
            exit 1
          fi

          echo "created_pr=$PR_NUM" >> $GITHUB_OUTPUT

      - name: Update PR body with PR ID
        if: steps.apply.outputs.changes_applied == 'true'
        run: |
          PR="${{ steps.create_pr.outputs.created_pr }}"
          {
            cat body.txt
            echo ""
            echo "PR ID: $PR"
            echo "Keep this PR ID to reference the exact changes deployed into production."
          } > updated_body.txt

          PAYLOAD=$(jq -n --arg body "$(cat updated_body.txt)" '{body:$body}')

          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}" > /dev/null

      - name: Apply Jira and environment labels
        if: steps.apply.outputs.changes_applied == 'true'
        run: |
          LABELS=$(jq -n --arg jira "${{ env.jira_id }}" '{labels: [$jira, "uat-to-prod"]}')
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$LABELS" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.create_pr.outputs.created_pr }}/labels"

      - name: Completed
        if: steps.apply.outputs.changes_applied == 'true'
        run: |
          echo "Promotion UAT → PROD completed successfully."
          echo "Created PR: #${{ steps.create_pr.outputs.created_pr }}"
