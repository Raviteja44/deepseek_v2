name: 4. Promote UAT → Production

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number that was merged into uat"
        required: true
        type: number
      source_branch:
        description: "Source branch: uat"
        required: true
        type: choice
        options:
          - uat

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Setup environment
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR and get merge info
        id: validate
        run: |
          PR="${{ github.event.inputs.pr_number }}"
          
          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}")
          
          MERGE_COMMIT=$(echo "$PR_JSON" | jq -r '.merge_commit_sha')
          BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.base.ref')
          MERGED=$(echo "$PR_JSON" | jq -r '.merged')
          
          if [ "$MERGED" != "true" ] || [ "$BASE_BRANCH" != "uat" ]; then
            echo "Error: PR #$PR not merged into uat"
            exit 1
          fi
          
          echo "pr_number=$PR" >> $GITHUB_OUTPUT
          echo "merge_commit=$MERGE_COMMIT" >> $GITHUB_OUTPUT

      - name: Get parent commit and changes
        id: get-changes
        run: |
          # Get the UAT state before merge
          git fetch origin uat
          PARENT=$(git log --pretty=%P -n 1 "${{ steps.validate.outputs.merge_commit }}" | awk '{print $1}')
          
          echo "parent_commit=$PARENT" >> $GITHUB_OUTPUT
          
          # Get all changes in this merge
          CHANGES=$(git diff --name-only "$PARENT" "${{ steps.validate.outputs.merge_commit }}")
          echo "changed_files<<EOF" >> $GITHUB_ENV
          echo "$CHANGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Check if changes already in Production
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "${{ steps.validate.outputs.merge_commit }}" origin/main; then
            echo "Changes already exist in Production."
            exit 0
          fi

      - name: Create promotion branch
        id: create_branch
        run: |
          TS=$(date +%s)
          BRANCH="promote/prod-pr${{ steps.validate.outputs.pr_number }}-${TS}"
          git fetch origin main
          git checkout -b "$BRANCH" origin/main
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Apply changes using merge-tree (Modern Approach)
        id: apply_changes
        run: |
          # Use git merge-tree to simulate merge without committing
          echo "Merging changes from UAT to Production..."
          
          # Create a temporary merge
          MERGE_RESULT=$(git merge-tree --write-tree origin/main "${{ steps.validate.outputs.merge_commit }}")
          
          if [ $? -eq 0 ]; then
            # Successful merge
            git reset --hard "$MERGE_RESULT"
            git commit --allow-empty -m "Promote to production: PR #${{ steps.validate.outputs.pr_number }}"
            echo "changes_applied=true" >> $GITHUB_OUTPUT
          else
            # Handle conflicts
            echo "Merge conflict detected"
            
            # Alternative: Create and apply patch
            git diff "${{ steps.get-changes.outputs.parent_commit }}" \
              "${{ steps.validate.outputs.merge_commit }}" > changes.patch
            
            if git apply --3way changes.patch; then
              git add .
              git commit -m "Promote to production: PR #${{ steps.validate.outputs.pr_number }}"
              echo "changes_applied=true" >> $GITHUB_OUTPUT
            else
              echo "Failed to apply changes automatically"
              echo "Manual intervention required"
              echo "changes_applied=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

      - name: Push and create PR
        if: steps.apply_changes.outputs.changes_applied == 'true'
        run: |
          git push origin "${{ steps.create_branch.outputs.branch }}"
          
          # Create PR
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "Production Release: PR #'"${{ steps.validate.outputs.pr_number }}"'",
              "head": "'"${{ steps.create_branch.outputs.branch }}"'",
              "base": "main",
              "body": "Promoting changes from UAT to Production\n\nSource PR: #'"${{ steps.validate.outputs.pr_number }}"'"
            }' \
            "https://api.github.com/repos/${{ github.repository }}/pulls")
          
          PR_NUM=$(echo "$RESPONSE" | jq -r '.number')
          echo "Created PR #$PR_NUM"
